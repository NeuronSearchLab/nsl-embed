name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Versioning is committed straight to main rather than proposed as a PR.
      #
      # changesets/action opens a "version packages" PR, and this org does not
      # permit GitHub Actions to create pull requests - so every release since
      # the repo began failed at that step and nothing ever reached npm. The
      # bump is mechanical and already reviewed as a changeset when the change
      # landed, so there is nothing for a second review to add.
      - name: Apply pending changesets
        id: changesets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(ls .changeset/*.md 2>/dev/null | grep -v README || true)" ]; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets."
            exit 0
          fi

          npm run version-packages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          # Publishing happens below in this same run, so [skip ci] keeps the
          # push from starting a second run that could only no-op.
          git commit -m "version packages [skip ci]"
          git push origin HEAD:main
          echo "pending=true" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          PACKAGE_NAME="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          PUBLISHED_VERSION="$(npm view "$PACKAGE_NAME" version 2>/dev/null || true)"

          if [ "$PACKAGE_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Version $PACKAGE_VERSION for $PACKAGE_NAME is already published; skipping."
            exit 0
          fi

          npm run build
          npm publish
