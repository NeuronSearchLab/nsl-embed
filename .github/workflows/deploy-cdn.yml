name: Deploy to CDN

# Publishing to npm is the changesets release; this puts the same bundle behind
# cdn.neuronsearchlab.com, which is what customer <script> tags actually load.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. 1.0.0
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Enforce the size budget
        run: npm run size

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute integrity hash
        id: integrity
        # Published in the release notes so customers can pin with SRI.
        run: |
          HASH="sha384-$(openssl dgst -sha384 -binary dist/nsl.min.js | openssl base64 -A)"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "integrity=\"$HASH\"" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.EMBED_CDN_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Upload the versioned bundle
        # Immutable: this exact path must never change under a customer's page,
        # which is also what makes the integrity hash above meaningful.
        run: |
          aws s3 cp dist/nsl.min.js \
            "s3://${{ secrets.EMBED_CDN_BUCKET }}/embed/${{ steps.version.outputs.version }}/nsl.min.js" \
            --content-type application/javascript \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/nsl.min.js.map \
            "s3://${{ secrets.EMBED_CDN_BUCKET }}/embed/${{ steps.version.outputs.version }}/nsl.min.js.map" \
            --content-type application/json \
            --cache-control "public, max-age=31536000, immutable"

      - name: Update the rolling v1 pointer
        # Short TTL, no SRI. The trade is stated in the README rather than
        # pretending one URL can offer both.
        run: |
          aws s3 cp dist/nsl.min.js \
            "s3://${{ secrets.EMBED_CDN_BUCKET }}/embed/v1.js" \
            --content-type application/javascript \
            --cache-control "public, max-age=300"

      - name: Invalidate the rolling pointer
        # Only the mutable path needs invalidating; versioned paths never change.
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.EMBED_CDN_DISTRIBUTION_ID }}" \
            --paths "/embed/v1.js"
